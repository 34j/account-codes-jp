[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77.0.3" ]

[project]
name = "account-codes-jp"
version = "1.0.0"
description = "e-Tax / EDINETタクソノミ / 青色申告 の勘定科目(コード)表のラッパー (非公式)"
readme = "README.md"
license = "AGPL-3.0-only"
authors = [
  { name = "34j" },
]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "cyclopts>=3.24.0,<4",
  "japanize-matplotlib>=1.1.3,<2",
  "matplotlib>=3.10.1,<4",
  "networkx>=3.4.2,<4",
  "numpy",
  "openpyxl>=3.1.5,<4",
  "pandas>=2.2.3,<3",
  "pykakasi>=2.3,<3",
  "pyyaml>=6.0.2,<7",
  "rapidfuzz>=3.12.2,<4",
  "requests-cache>=1.2.1,<2",
  "rich>=13.9.4,<14",
  "scipy>=1.15.2,<2",
  "setuptools>=75.8.2,<76",
  "strenum>=0.4.15,<0.5",
]
urls."Bug Tracker" = "https://github.com/34j/account-codes-jp/issues"
urls.Changelog = "https://github.com/34j/account-codes-jp/blob/main/CHANGELOG.md"
urls.documentation = "https://account-codes-jp.readthedocs.io"
urls.repository = "https://github.com/34j/account-codes-jp"
scripts.account-codes-jp = "account_codes_jp.cli:app"

[dependency-groups]
dev = [
  "coverage",
  "ipykernel",
  "packaging-34j[test]>=1.1.8",
  "pytest",
  "pytest-cov",
  "ty",
]
docs = [
  "packaging-34j[docs]",
]
graphviz = [
  "pygraphviz>=1.14",
]

[tool.ruff]
extend = ".venv/ruff.toml"
lint.extend-ignore = [
  "A001",
  "A002",
  "A004",
  "BLE001",
  "C901",
  "DOC501",
  "FBT001",
  "FBT002",
  "FBT003",
  "G004",
  "N803",
  "N806",
  "PLC0415",
  "PLR2004",
  "RUF001",
  "RUF002",
  "S404",
]
lint.extend-per-file-ignores."/**/tests/**/*" = [
  "S603", # Test subprocess uses a fixed executable and argument list.
]

[tool.pyproject-fmt]
max_supported_python = "3.14"

[tool.ty]
terminal.error-on-warning = true
